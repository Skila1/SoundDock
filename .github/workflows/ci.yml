# Authored U+2014 (em dash) ban. Not a test/lint/build suite.
# GitHub only (same guard as docker.yml).
name: emdash

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Fail on authored em dashes
        run: go test ./internal/lint/ -run TestNoAuthoredEmDash -count=1
