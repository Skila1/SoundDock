# Pull request and push checks. GitHub only (same guard as docker.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sounddock
          POSTGRES_PASSWORD: sounddock
          POSTGRES_DB: sounddock_w0
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sounddock -d sounddock_w0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Create migrate test database
        env:
          PGPASSWORD: sounddock
        run: psql -h 127.0.0.1 -p 55432 -U sounddock -d sounddock_w0 -c "CREATE DATABASE sounddock_mig;"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web checks
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npx tsc --noEmit
          npx eslint .
          npm run build
      - name: Go tests
        env:
          SD_TEST_DATABASE_URL: postgres://sounddock:sounddock@127.0.0.1:55432/sounddock_w0?sslmode=disable
          SD_TEST_MIGRATE_URL: postgres://sounddock:sounddock@127.0.0.1:55432/sounddock_mig?sslmode=disable
        run: go test ./...
