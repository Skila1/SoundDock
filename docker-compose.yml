services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sounddock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sounddock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sounddock} -d ${POSTGRES_DB:-sounddock}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sounddock

  sounddock:
    image: ${SD_IMAGE:-ghcr.io/sounddock/sounddock:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["all"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SD_ROLE: all
      SD_DATABASE_URL: postgres://${POSTGRES_USER:-sounddock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sounddock}?sslmode=disable
    volumes:
      - sounddock_data:/data
      - ${SD_LIBRARY_HOST:-./libraries}:/libraries:ro
    ports:
      - "${SD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sounddock

  discord-worker:
    image: ${SD_IMAGE:-ghcr.io/sounddock/sounddock:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["discord"]
    restart: unless-stopped
    stop_grace_period: 30s
    profiles: ["discord"]
    depends_on:
      postgres:
        condition: service_healthy
      sounddock:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SD_ROLE: discord
      SD_DATABASE_URL: postgres://${POSTGRES_USER:-sounddock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sounddock}?sslmode=disable
      SD_HTTP_ADDR: ":8081"
    volumes:
      - sounddock_data:/data
      - ${SD_LIBRARY_HOST:-./libraries}:/libraries:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - sounddock

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      sounddock:
        condition: service_healthy
    networks:
      - sounddock

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - sounddock

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: ${SD_MEILISEARCH_KEY:-}
    volumes:
      - meili_data:/meili_data
    networks:
      - sounddock

volumes:
  postgres_data:
  sounddock_data:
  redis_data:
  meili_data:

networks:
  sounddock:
    driver: bridge
