services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sounddock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sounddock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sounddock} -d ${POSTGRES_DB:-sounddock}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sounddock

  sounddock:
    image: ${SD_IMAGE:-ghcr.io/skila1/sounddock:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["app"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SD_ROLE: app
      SD_UPDATE_DIR: /update
      SD_DATABASE_URL: postgres://${POSTGRES_USER:-sounddock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sounddock}?sslmode=disable
    volumes:
      - sounddock_data:/data
      - ${SD_LIBRARY_HOST:-./libraries}:/libraries:ro
      - ./update:/update
    ports:
      - "${SD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sounddock

  discord-worker:
    image: ${SD_IMAGE:-ghcr.io/skila1/sounddock:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["discord"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      sounddock:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SD_ROLE: discord
      SD_DATABASE_URL: postgres://${POSTGRES_USER:-sounddock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sounddock}?sslmode=disable
      SD_HTTP_ADDR: ":8081"
    volumes:
      - sounddock_data:/data
      - ${SD_LIBRARY_HOST:-./libraries}:/libraries:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - sounddock

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - sounddock

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: ${SD_MEILISEARCH_KEY:-}
    volumes:
      - meili_data:/meili_data
    networks:
      - sounddock

  # Optional lyrics generation (compose profile: lyrics). Runs the official
  # whisper.cpp server (MIT, https://github.com/ggml-org/whisper.cpp) as its
  # own container; SoundDock only calls its HTTP API. Set
  # SD_WHISPER_URL=http://whisper:8080 in .env to connect it. The image tag is
  # pinned to the v1.9.5 release commit. The speech model and the Silero
  # voice activity model (which skips instrumental parts so whisper does not
  # invent lyrics over them) are downloaded once into whisper_models.
  whisper:
    image: ${SD_WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main-d1be6fde11ac6e0407606b4e42fe72d34add8037}
    restart: unless-stopped
    profiles: ["lyrics"]
    environment:
      WHISPER_MODEL: ${SD_WHISPER_MODEL:-small}
      WHISPER_THREADS: ${SD_WHISPER_THREADS:-4}
    command:
      - |
        set -e
        ./models/download-ggml-model.sh "$$WHISPER_MODEL" /models
        ./models/download-vad-model.sh silero-v6.2.0 /models
        exec whisper-server --host 0.0.0.0 --port 8080 -m "/models/ggml-$$WHISPER_MODEL.bin" -t "$$WHISPER_THREADS" -l auto --vad -vm /models/ggml-silero-v6.2.0.bin
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10m
    networks:
      - sounddock

volumes:
  postgres_data:
  sounddock_data:
  redis_data:
  meili_data:
  whisper_models:

networks:
  sounddock:
    driver: bridge
